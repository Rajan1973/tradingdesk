<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order Flow</title>
<style>
  :root { --bg: #fff; --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb; --buy: #00796b; --sell: #c62828; --warn: #fff7e0; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 14px; margin: 0; }
  label { display: inline-flex; gap: 5px; align-items: center; color: var(--muted); }
  select, input, button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; min-height: 26px; }
  input { width: 62px; }
  button { cursor: pointer; }
  #hint { color: var(--sell); }
  #state { margin-left: auto; color: var(--muted); }
  #state.live { color: var(--buy); font-weight: 600; }
  #state.bad { color: var(--sell); font-weight: 600; }
  #note { background: var(--warn); padding: 4px 12px; border-bottom: 1px solid var(--line); }
  #read { padding: 4px 12px; min-height: 26px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  #read b.up { color: var(--buy); }
  #read b.dn { color: var(--sell); }
  #chart { flex: 1; min-height: 320px; position: relative; }
  /* Inside a chart panel: every line of height goes to the chart. */
  .embed #note, .embed h1, .embed #symWrap { display: none; }
  #sym { width: 120px; text-transform: uppercase; }
  .embed header { padding: 4px 6px; gap: 3px 8px; font-size: 12px; }
  .embed #read { padding: 2px 6px; font-size: 12px; min-height: 20px; }
  .embed #chart { min-height: 100px; }
  .embed select, .embed input, .embed button { min-height: 22px; padding: 1px 3px; }
  .embed #state { font-size: 11px; }
  @media (max-width: 620px) {
    /* A small panel keeps only what changes the picture. */
    .embed .roomy, .embed #read, .embed #hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Order flow</h1>
  <label id="symWrap">Symbol <input id="sym" list="symList" autocomplete="off" title="Type an NSE stock, NIFTY, BANKNIFTY, SENSEX or BTC, then press Enter" /><datalist id="symList"></datalist></label>
  <label>Timeframe <select id="tf"><option>1m</option><option selected>5m</option><option>15m</option><option>30m</option><option>1h</option><option>4h</option></select></label>
  <label>Row size <select id="step"></select></label>
  <label>View <select id="view"><option value="bidask">Sell × Buy</option><option value="delta">Delta</option><option value="volume">Volume</option><option value="profile">Market Profile</option><option value="candles">Candles only</option></select></label>
  <label class="roomy">Imbalance ratio <select id="ratio"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
  <label class="roomy"><span id="minLabel">Min BTC</span> <input id="minQty" type="number" min="0" step="0.1" value="0.5" /></label>
  <button class="roomy" id="zoom" title="Jump to the newest bars, zoomed in so the numbers show">Latest, zoomed in</button>
  <span id="hint"></span>
  <span id="state" role="status">Starting…</span>
</header>
<div id="note"></div>
<div id="read">Move the mouse over a bar for its numbers.</div>
<div id="chart"></div>
<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<script type="module" src="/js/orderflow.js"></script>
</body>
</html>
